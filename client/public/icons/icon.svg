<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Radio / Telemetry Pulse Rings (top right) -->
  <circle cx="400" cy="112" r="32" fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.4" />
  <circle cx="400" cy="112" r="56" fill="none" stroke="#93c5fd" stroke-width="6" opacity="0.3" />
  <circle cx="400" cy="112" r="14" fill="#38bdf8" />

  <!-- Main Bus Body with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Bus Outer Shell -->
    <rect x="120" y="140" width="272" height="260" rx="44" fill="url(#busGrad)" />

    <!-- Front Bumper / Under-trim -->
    <rect x="140" y="370" width="232" height="20" rx="10" fill="#cbd5e1" />

    <!-- Windshield -->
    <rect x="148" y="168" width="216" height="110" rx="20" fill="url(#windshieldGrad)" />

    <!-- Destination / Route Sign on Bus Header -->
    <rect x="180" y="150" width="152" height="14" rx="7" fill="#2563eb" />
    <circle cx="192" cy="157" r="3" fill="#60a5fa" />
    <rect x="202" y="155" width="116" height="4" rx="2" fill="#bfdbfe" />

    <!-- Headlights -->
    <circle cx="168" cy="328" r="22" fill="#f59e0b" />
    <circle cx="168" cy="328" r="16" fill="#fef08a" />
    <circle cx="344" cy="328" r="22" fill="#f59e0b" />
    <circle cx="344" cy="328" r="16" fill="#fef08a" />

    <!-- Center Grille Accent -->
    <rect x="220" y="324" width="72" height="8" rx="4" fill="#94a3b8" />
    <rect x="232" y="338" width="48" height="6" rx="3" fill="#cbd5e1" />

    <!-- Wheels -->
    <rect x="100" y="350" width="28" height="54" rx="12" fill="#1e293b" />
    <rect x="384" y="350" width="28" height="54" rx="12" fill="#1e293b" />
  </g>
</svg>
